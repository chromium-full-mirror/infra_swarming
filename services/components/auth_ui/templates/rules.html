{% extends 'base.html' %}
{% block content %}

<div class="row">
  <div class="col-md-12">
    <div class="panel panel-default" id="rule-list">
      <div class="panel-heading"><h3 class="panel-title">ACL Rules</h3></div>
      <div class="panel-body">
        <div id="alerts"></div>
        <form class="form" role="form" id="rules-form">
          <div class="form-group">
            <div style="font-family:monospace;">
              <textarea class="form-control"
                        rows="16" name="rules" wrap="off"></textarea>
            </div>
          </div>
          <div class="form-group">
            <button type="submit" class="btn btn-primary">
              Update rules
            </button>
            <button id="sandbox-btn" type="button" class="btn btn-default">
              Open sandbox
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>


<div class="modal fade" id="sandbox-modal">
  <div class="modal-dialog" style="width: 800px;">
    <div class="modal-content">
      <div class="modal-header">
        <button type="button" class="close"
                data-dismiss="modal" aria-hidden="true">&times;</button>
        <h4 class="modal-title">Rules sandbox</h4>
      </div>
      <form class="form" role="form">
        <div class="modal-body">
          <div id="alerts"></div>
          <div class="form-group">
            <input type="text" class="form-control"
                   name="identity" placeholder="Identity">
          </div>
          <div class="form-group">
            <input type="text" class="form-control"
                   name="action" placeholder="Action">
          </div>
          <div class="form-group">
            <input type="text" class="form-control"
                   name="resource" placeholder="Resource">
          </div>
          <div class="form-group hidden" id="results-panel">
            <hr>
            <pre id="results-box" style="font-family:monospace;"></pre>
          </div>
        </div>
        <div class="modal-footer">
          <button id="check-button" type="submit"
                  class="btn btn-primary pull-left">Check</button>
          <button type="button"
                  class="btn btn-default" data-dismiss="modal">Close</button>
        </div>
      </form>
    </div>
  </div>
</div>

{% endblock %}
