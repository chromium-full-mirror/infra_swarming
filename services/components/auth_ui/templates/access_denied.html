<head>
  <meta http-equiv="Content-type" content="text/html;charset=UTF-8">
  <title>Access Denied</title>
  <link href="/auth/static/third_party/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="/auth/static/css/common.css" rel="stylesheet">
  <script src="/auth/static/js/common.js"></script>
</head>

<body>
  <div class="container">
    <div class="jumbotron">
      <h1>Access denied</h1>
      <p>Looks like you do not have access to this page. You are logged in as
      <b>{{identity.name}}</b>. Try to login under a different account?</p>
      <p>
      <a class="btn btn-lg btn-primary" href="javascript:common.logout();">Logout</a>
      </p>
    </div>
  </div>
  <script type="text/javascript">
    var config = {{config|safe}};
  </script>
</body>
