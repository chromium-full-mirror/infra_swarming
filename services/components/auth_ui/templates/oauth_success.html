{% extends 'base_minimal.html' %}
{% block content %}

<div class="jumbotron">
  <h2>Success!</h2>
  <p>You have obtained access token for <strong>{{identity.name}}</strong>.</p>
</div>

<div class="row">
  <div class="col-md-12">
    <p>Copy paste it to the client:</p>
    <div class="controls">
      <input type="text"
             class="form-control"
             style="font-family:monospace;"
             onclick="this.select();"
             value="{{access_token}}"/>
    </div>
  </div>
</div>

{% endblock %}
